plugins { id 'com.android.application' }

android {
    namespace 'ru.mansionstrike'
    compileSdk 34
    defaultConfig {
        applicationId 'ru.mansionstrike'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')
        versionName '2.0.' + (System.getenv('BUILD_NUMBER') ?: '0')
    }
    signingConfigs {
        // Fixed (non-secret) debug key kept in the repo so every build installs over the previous one.
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug { signingConfig signingConfigs.shared }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
